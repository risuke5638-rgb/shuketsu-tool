<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>王城集結ツール</title><style>body{font-family:system-ui;background:#111827;color:white;max-width:550px;margin:auto;padding:15px}section{background:#243044;border-radius:12px;padding:15px;margin:12px 0}input,button,select{font-size:16px;padding:9px;border-radius:7px;border:1px solid #64748b;background:#172033;color:white;box-sizing:border-box}button{cursor:pointer}button.main{background:#2563eb}input{min-width:0;width:100%}.person{display:grid;grid-template-columns:20px 1fr 70px 34px 34px;gap:5px;margin:8px 0;align-items:center}.clock{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.clock input,.clock select{width:100%}.line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #465166}.small{font-size:12px;color:#b9c6da}.btns{display:flex;gap:5px}.btns button{flex:1}.big{text-align:center;font-size:28px;font-weight:bold;margin:12px}.choice{display:block;margin:12px 0}.choice input{width:auto}</style><h2>🏰 王城・連続集結計算</h2><p class="small">登録情報は同じブラウザに自動保存</p><section><h3>① 集結主（強い順）</h3><div id="people"></div><button onclick="add()">＋ 追加</button> <button onclick="backup()">登録情報コピー</button><p class="small" id="saved"></p></section><section><h3>② 参加者</h3><div class="btns"><button id="b2" onclick="mode=2;selected=selected.slice(0,2);save();draw()">2連</button><button id="b3" onclick="mode=3;save();draw()">3連</button></div><div id="choices"></div></section><section><h3>③ 基準時刻（UTC）</h3><button class="main" style="width:100%" onclick="utc()">🕒 現在のUTC時刻を入力</button><div class="clock"><div>時<input id="h" type="number" value="18"><div class="btns"><button onclick="step('h',-1,24)">▼</button><button onclick="step('h',1,24)">▲</button></div></div><div>分<input id="m" type="number" value="14"><div class="btns"><button onclick="step('m',-1,60)">▼</button><button onclick="step('m',1,60)">▲</button></div></div><div>秒<select id="s"><option>00</option><option>10</option><option>20</option><option>30</option><option>40</option><option>50</option></select></div></div><p class="small">現在時刻ボタンは端末時計をUTCに変換。秒は10秒刻みに切り捨て。</p></section><section><h3>④ 計算結果</h3><div id="result"></div><button class="main" style="width:100%;margin-top:12px" onclick="copySchedule()">集結開始＋着弾予定をコピー</button><p class="small" id="copied"></p></section><p class="small">同じブラウザで開くと登録内容を復元できます。ブラウザデータ削除等では消える場合があります。</p><script>
const key="ks_rally_demo_v1",initial=[{id:1,name:"みのの",march:"35"},{id:2,name:"ゴリさん",march:"36"},{id:3,name:"あっきー",march:"40"},{id:4,name:"りすけ",march:"42"}];let people,selected,mode;try{let d=JSON.parse(localStorage.getItem(key));people=d.people;selected=d.selected;mode=d.mode}catch(e){people=initial;selected=[1,2,3];mode=3}let next=Math.max(0,...people.map(x=>x.id))+1,copyValue="";const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(key,JSON.stringify({people,selected,mode}));$("saved").textContent="自動保存済み"}catch(e){$("saved").textContent="保存できません。コピーで控えてください"}}function esc(x){return String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function draw(){$("people").innerHTML=people.map((p,i)=>`<div class="person"><span>${i+1}</span><input value="${esc(p.name)}" oninput="edit(${p.id},'name',this.value)"><input type="number" value="${esc(p.march)}" oninput="edit(${p.id},'march',this.value)"><div><button onclick="move(${p.id},-1)" ${i===0?"disabled":""}>▲</button><button onclick="move(${p.id},1)" ${i===people.length-1?"disabled":""}>▼</button></div><button onclick="del(${p.id})">×</button></div>`).join("");$("b2").style.background=mode===2?"#2563eb":"";$("b3").style.background=mode===3?"#2563eb":"";choices();calc()}
function choices(){$("choices").innerHTML=people.map(p=>`<label class="choice"><input type="checkbox" ${selected.includes(p.id)?"checked":""} onchange="toggle(${p.id},this)"> ${esc(p.name||"未入力")}（${esc(p.march||"-")}秒）</label>`).join("")}
function edit(id,k,v){people.find(p=>p.id===id)[k]=v;save();choices();calc()}function add(){people.push({id:next++,name:"",march:""});save();draw()}function del(id){people=people.filter(p=>p.id!==id);selected=selected.filter(x=>x!==id);save();draw()}function move(id,d){let i=people.findIndex(x=>x.id===id),j=i+d;if(j<0||j>=people.length)return;[people[i],people[j]]=[people[j],people[i]];save();draw()}function toggle(id,el){if(el.checked){if(selected.length>=mode){el.checked=false;return}selected.push(id)}else selected=selected.filter(x=>x!==id);save();calc()}
function utc(){let d=new Date();$("h").value=d.getUTCHours();$("m").value=d.getUTCMinutes();$("s").value=String(Math.floor(d.getUTCSeconds()/10)*10).padStart(2,"0");calc()}function step(id,d,max){$(id).value=(Number($(id).value)+d+max)%max;calc()}function fmt(t){let n=((t%86400)+86400)%86400;return [Math.floor(n/3600),Math.floor(n%3600/60),n%60].map(x=>String(x).padStart(2,"0")).join(":")}
function calc(){let h=Number($("h").value),m=Number($("m").value),s=Number($("s").value),chosen=people.filter(p=>selected.includes(p.id));if(chosen.length!==mode||!chosen.every(p=>p.name.trim()&&/^\d+$/.test(p.march)&&+p.march>0)||h<0||h>23||m<0||m>59){$("result").textContent="参加者と時刻を確認してください";copyValue="";return}let base=h*3600+m*60+s,raw=chosen.map((p,i)=>({p,r:(i===0?1:0)-Number(p.march)})),min=Math.min(...raw.map(x=>x.r)),starts=raw.map(x=>({name:x.p.name,rank:people.indexOf(x.p),offset:x.r-min,start:base+x.r-min,arrival:base+x.r-min+300+Number(x.p.march)})).sort((a,b)=>a.start-b.start||a.rank-b.rank),arrivals=[...starts].sort((a,b)=>a.arrival-b.arrival||b.rank-a.rank),last=Math.max(...arrivals.map(x=>x.arrival));$("result").innerHTML="<h4>集結開始</h4>"+starts.map(x=>`<div class="line"><span>${esc(x.name)} <small>＋${x.offset}秒</small></span><b>${fmt(x.start)}</b></div>`).join("")+"<h4>王城への着弾</h4>"+arrivals.map(x=>`<div class="line"><span>${esc(x.name)}</span><b>${fmt(x.arrival)}</b></div>`).join("")+"<p class='small' style='text-align:center'>最終着弾予定（UTC）</p><div class='big'>"+fmt(last)+"</div>";copyValue=`【王城${mode}連集結／UTC】\n【集結開始】\n${starts.map((x,i)=>`${i+1} ${x.name}：${fmt(x.start)}${x.offset?"（＋"+x.offset+"秒）":"（基準）"}`).join("\n")}\n【着弾予定】${fmt(last)}`}
async function cp(t){try{await navigator.clipboard.writeText(t);return true}catch(e){let a=document.createElement("textarea");a.value=t;document.body.append(a);a.select();let ok=document.execCommand("copy");a.remove();return ok}}async function backup(){$("saved").textContent=await cp(people.map(p=>p.name+"\t"+p.march).join("\n"))?"登録情報をコピーしました":"コピーできませんでした"}async function copySchedule(){$("copied").textContent=copyValue&&(await cp(copyValue))?"コピーしました":"コピーできませんでした"}["h","m","s"].forEach(id=>$(id).addEventListener("change",calc));draw();
</script></html>
