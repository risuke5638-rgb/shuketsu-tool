</style><h2>🏰 王城・連続集結計算</h2><p class="small">登録情報は同じブラウザに自動保存</p><section><h3>① 集結主（強い順）</h3><div class="person person-header"><span>順</span><span>名前</span><span>行軍時間（秒）</span><span></span><span></span></div><div id="people"></div><button onclick="add()">＋ 追加</button> <button onclick="backup()">登録情報コピー</button><p class="small" id="saved"></p></section><section><h3>② 参加者</h3><div class="btns"><button id="b2" onclick="mode=2;selected=people.slice(0,2).map(p=&gt;p.id);save();draw()">2連</button><button id="b3" onclick="mode=3;selected=people.slice(0,3).map(p=&gt;p.id);save();draw()">3連</button></div><div id="choices"></div></section><section><h3>③ 基準時刻（UTC）</h3><button class="main" onclick="utc()" style="width:100%">🕒 現在のUTC時刻を入力<span style="display:block;font-size:0.7em;font-weight:normal">(端末時計をUTCに変換)</span></button><div class="clock"><div>時<select id="h"><option value="0">00</option><option value="1">01</option><option value="2">02</option><option value="3">03</option><option value="4">04</option><option value="5">05</option><option value="6">06</option><option value="7">07</option><option value="8">08</option><option value="9">09</option><option value="10">10</option><option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option><option value="17">17</option><option selected="" value="18">18</option><option value="19">19</option><option value="20">20</option><option value="21">21</option><option value="22">22</option><option value="23">23</option></select></div><div>分<select id="m"><option value="0">00</option><option value="1">01</option><option value="2">02</option><option value="3">03</option><option value="4">04</option><option value="5">05</option><option value="6">06</option><option value="7">07</option><option value="8">08</option><option value="9">09</option><option value="10">10</option><option value="11">11</option><option value="12">12</option><option value="13">13</option><option selected="" value="14">14</option><option value="15">15</option><option value="16">16</option><option value="17">17</option><option value="18">18</option><option value="19">19</option><option value="20">20</option><option value="21">21</option><option value="22">22</option><option value="23">23</option><option value="24">24</option><option value="25">25</option><option value="26">26</option><option value="27">27</option><option value="28">28</option><option value="29">29</option><option value="30">30</option><option value="31">31</option><option value="32">32</option><option value="33">33</option><option value="34">34</option><option value="35">35</option><option value="36">36</option><option value="37">37</option><option value="38">38</option><option value="39">39</option><option value="40">40</option><option value="41">41</option><option value="42">42</option><option value="43">43</option><option value="44">44</option><option value="45">45</option><option value="46">46</option><option value="47">47</option><option value="48">48</option><option value="49">49</option><option value="50">50</option><option value="51">51</option><option value="52">52</option><option value="53">53</option><option value="54">54</option><option value="55">55</option><option value="56">56</option><option value="57">57</option><option value="58">58</option><option value="59">59</option></select></div><div>秒(10秒単位)<select id="s"><option>00</option><option>10</option><option>20</option><option>30</option><option>40</option><option>50</option></select></div></div></section><section><h3>④ 計算結果</h3><button class="main" onclick="copySchedule()" style="width:100%;margin:0 0 12px">集結開始＋着弾予定をコピー</button><div id="result"></div><p class="small" id="copied"></p></section><section><h3>⑤ 着弾時間予測</h3><p class="small">集結開始から待機5分＋行軍時間で計算（UTC）。①〜④とは独立して使えます。</p><button class="main" onclick="arrivalUTC()" style="width:100%;margin-bottom:12px">🕒 現在のUTC時刻を入力</button><div class="clock"><div>時<select id="ah" onchange="arrivalCalc()"><option value="0">00</option><option value="1">01</option><option value="2">02</option><option value="3">03</option><option value="4">04</option><option value="5">05</option><option value="6">06</option><option value="7">07</option><option value="8">08</option><option value="9">09</option><option value="10">10</option><option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option><option value="17">17</option><option selected="" value="18">18</option><option value="19">19</option><option value="20">20</option><option value="21">21</option><option value="22">22</option><option value="23">23</option></select></div><div>分<select id="am" onchange="arrivalCalc()"><option value="0">00</option><option value="1">01</option><option value="2">02</option><option value="3">03</option><option value="4">04</option><option value="5">05</option><option value="6">06</option><option value="7">07</option><option value="8">08</option><option value="9">09</option><option value="10">10</option><option value="11">11</option><option value="12">12</option><option value="13">13</option><option selected="" value="14">14</option><option value="15">15</option><option value="16">16</option><option value="17">17</option><option value="18">18</option><option value="19">19</option><option value="20">20</option><option value="21">21</option><option value="22">22</option><option value="23">23</option><option value="24">24</option><option value="25">25</option><option value="26">26</option><option value="27">27</option><option value="28">28</option><option value="29">29</option><option value="30">30</option><option value="31">31</option><option value="32">32</option><option value="33">33</option><option value="34">34</option><option value="35">35</option><option value="36">36</option><option value="37">37</option><option value="38">38</option><option value="39">39</option><option value="40">40</option><option value="41">41</option><option value="42">42</option><option value="43">43</option><option value="44">44</option><option value="45">45</option><option value="46">46</option><option value="47">47</option><option value="48">48</option><option value="49">49</option><option value="50">50</option><option value="51">51</option><option value="52">52</option><option value="53">53</option><option value="54">54</option><option value="55">55</option><option value="56">56</option><option value="57">57</option><option value="58">58</option><option value="59">59</option></select></div><div>秒<select id="as" onchange="arrivalCalc()"><option selected="" value="0">00</option><option value="1">01</option><option value="2">02</option><option value="3">03</option><option value="4">04</option><option value="5">05</option><option value="6">06</option><option value="7">07</option><option value="8">08</option><option value="9">09</option><option value="10">10</option><option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option><option value="17">17</option><option value="18">18</option><option value="19">19</option><option value="20">20</option><option value="21">21</option><option value="22">22</option><option value="23">23</option><option value="24">24</option><option value="25">25</option><option value="26">26</option><option value="27">27</option><option value="28">28</option><option value="29">29</option><option value="30">30</option><option value="31">31</option><option value="32">32</option><option value="33">33</option><option value="34">34</option><option value="35">35</option><option value="36">36</option><option value="37">37</option><option value="38">38</option><option value="39">39</option><option value="40">40</option><option value="41">41</option><option value="42">42</option><option value="43">43</option><option value="44">44</option><option value="45">45</option><option value="46">46</option><option value="47">47</option><option value="48">48</option><option value="49">49</option><option value="50">50</option><option value="51">51</option><option value="52">52</option><option value="53">53</option><option value="54">54</option><option value="55">55</option><option value="56">56</option><option value="57">57</option><option value="58">58</option><option value="59">59</option></select></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px"><label>集結主名（空欄可）<input id="aname" oninput="arrivalCalc()" placeholder="名前（任意）"/></label><label>行軍時間予測（秒）<input id="amarch" min="0" oninput="arrivalCalc()" placeholder="例：40" step="1" type="number"/></label></div><p class="small" id="aerror"></p><p class="small" style="text-align:center;margin:12px 0 0">着弾予定時刻（UTC）</p><div class="big" id="aresult">--:--:--</div><button class="main" onclick="copyArrival()" style="width:100%">着弾予定をコピー</button><p class="small" id="acopied"></p></section><p class="small">同じブラウザで開くと登録内容を復元できます。ブラウザデータ削除等では消える場合があります。</p><script>
const key="ks_rally_demo_v1",initial=[{id:1,name:"",march:""},{id:2,name:"",march:""},{id:3,name:"",march:""}];let people,selected,mode;try{let d=JSON.parse(localStorage.getItem(key));people=d.people;selected=d.selected;mode=d.mode}catch(e){people=initial;selected=[];mode=3}if(!Array.isArray(people))people=initial;if(!Array.isArray(selected))selected=[];if(![2,3].includes(mode))mode=3;if(people.length===0){people=initial.map(x=>({...x}));selected=[]}mode=2;selected=people.slice(0,2).map(p=>p.id);let next=Math.max(0,...people.map(x=>x.id))+1,copyValue="";const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(key,JSON.stringify({people,selected,mode}));$("saved").textContent="自動保存済み"}catch(e){$("saved").textContent="保存できません。コピーで控えてください"}}function esc(x){return String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function draw(){$("people").innerHTML=people.map((p,i)=>`<div class="person"><span>${i+1}</span><input value="${esc(p.name)}" oninput="edit(${p.id},'name',this.value)"><input type="number" value="${esc(p.march)}" oninput="edit(${p.id},'march',this.value)"><div><button onclick="move(${p.id},-1)" ${i===0?"disabled":""}>▲</button><button onclick="move(${p.id},1)" ${i===people.length-1?"disabled":""}>▼</button></div><button onclick="del(${p.id})">×</button></div>`).join("");$("b2").style.background=mode===2?"#2563eb":"";$("b3").style.background=mode===3?"#2563eb":"";choices();calc()}
function choices(){$("choices").innerHTML=people.map(p=>`<label class="choice"><input type="checkbox" ${selected.includes(p.id)?"checked":""} onchange="toggle(${p.id},this)"> ${esc(p.name||"未入力")}（${esc(p.march||"-")}秒）</label>`).join("")}
function edit(id,k,v){people.find(p=>p.id===id)[k]=v;save();choices();calc()}function add(){people.push({id:next++,name:"",march:""});save();draw()}function del(id){people=people.filter(p=>p.id!==id);selected=selected.filter(x=>x!==id);save();draw()}function move(id,d){let i=people.findIndex(x=>x.id===id),j=i+d;if(j<0||j>=people.length)return;[people[i],people[j]]=[people[j],people[i]];save();draw()}function toggle(id,el){if(el.checked){if(selected.length>=mode){el.checked=false;return}selected.push(id)}else selected=selected.filter(x=>x!==id);save();calc()}
function utc(){let d=new Date();let sec=d.getUTCSeconds();d.setUTCSeconds(sec+((10-sec%10)%10));$("h").value=d.getUTCHours();$("m").value=d.getUTCMinutes();$("s").value=String(d.getUTCSeconds()).padStart(2,"0");calc()}function step(id,d,max){$(id).value=(Number($(id).value)+d+max)%max;calc()}function fmt(t){let n=((t%86400)+86400)%86400;return [Math.floor(n/3600),Math.floor(n%3600/60),n%60].map(x=>String(x).padStart(2,"0")).join(":")}
function calc(){let h=Number($("h").value),m=Number($("m").value),s=Number($("s").value),chosen=people.filter(p=>selected.includes(p.id));if(chosen.length!==mode||!chosen.every(p=>p.name.trim()&&/^\d+$/.test(p.march)&&+p.march>0)||h<0||h>23||m<0||m>59){$("result").textContent="参加者と時刻を確認してください";copyValue="";return}let base=h*3600+m*60+s,raw=chosen.map((p,i)=>({p,r:(i===0?1:0)-Number(p.march)})),min=Math.min(...raw.map(x=>x.r)),starts=raw.map(x=>({name:x.p.name,rank:people.indexOf(x.p),offset:x.r-min,start:base+x.r-min,arrival:base+x.r-min+300+Number(x.p.march)})).sort((a,b)=>a.start-b.start||a.rank-b.rank),arrivals=[...starts].sort((a,b)=>a.arrival-b.arrival||b.rank-a.rank),last=Math.max(...arrivals.map(x=>x.arrival));$("result").innerHTML="<h4>集結開始</h4>"+starts.map(x=>`<div class="line"><span>${esc(x.name)} <small>＋${x.offset}秒</small></span><b>${fmt(x.start)}</b></div>`).join("")+"<h4>王城への着弾</h4>"+arrivals.map(x=>`<div class="line"><span>${esc(x.name)}</span><b>${fmt(x.arrival)}</b></div>`).join("")+"<p class='small' style='text-align:center'>最終着弾予定（UTC）</p><div class='big'>"+fmt(last)+"</div>";copyValue=`【王城${mode}連集結／UTC】\n【集結開始】\n${starts.map((x,i)=>`${i+1} ${x.name}：${fmt(x.start)}${x.offset?"（＋"+x.offset+"秒）":"（基準）"}`).join("\n")}\n【着弾予定】${fmt(last)}`}
async function cp(t){try{await navigator.clipboard.writeText(t);return true}catch(e){let a=document.createElement("textarea");a.value=t;document.body.append(a);a.select();let ok=document.execCommand("copy");a.remove();return ok}}async function backup(){$("saved").textContent=await cp(people.map(p=>p.name+"\t"+p.march).join("\n"))?"登録情報をコピーしました":"コピーできませんでした"}async function copySchedule(){$("copied").textContent=copyValue&&(await cp(copyValue))?"コピーしました":"コピーできませんでした"}["h","m","s"].forEach(id=>$(id).addEventListener("change",calc));draw();

// ⑤ 独立した着弾時間予測。既存の登録情報の保存キーは変更しない。
let arrivalCopyValue="";
function arrivalUTC(){const d=new Date();$("ah").value=String(d.getUTCHours()).padStart(2,"0");$("am").value=String(d.getUTCMinutes()).padStart(2,"0");$("as").value=String(d.getUTCSeconds()).padStart(2,"0");arrivalCalc()}
function arrivalStep(id,delta,max){const el=$(id);el.value=String(((Number(el.value)||0)+delta+max)%max).padStart(2,"0");arrivalCalc()}
function arrivalCalc(){const h=Number($("ah").value),m=Number($("am").value),s=Number($("as").value),raw=$("amarch").value.trim();const validTime=[["ah",h,23],["am",m,59],["as",s,59]].every(([id,v,max])=>$(id).value.trim()!==""&&Number.isInteger(v)&&v>=0&&v<=max);const validMarch=/^\d+$/.test(raw)&&Number.isSafeInteger(Number(raw));if(!validTime||!validMarch){$("aresult").textContent="--:--:--";$("aerror").textContent=!validTime?"UTC時刻を確認してください。":"行軍時間予測（秒）を入力してください。";arrivalCopyValue="";return}const t=fmt(h*3600+m*60+s+300+Number(raw)),name=$("aname").value.trim();$("aresult").textContent=t;$("aerror").textContent="";arrivalCopyValue=(name?name+"が":"")+t+"着弾予定"}
async function copyArrival(){$("acopied").textContent=arrivalCopyValue&&(await cp(arrivalCopyValue))?"コピーしました":"行軍時間を入力してからコピーしてください"}
arrivalCalc();
</script></html>
